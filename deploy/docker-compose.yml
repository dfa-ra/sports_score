# Run from the deploy root, not from this folder:
#   docker compose --project-directory /opt/studentleague -f /opt/studentleague/deploy/docker-compose.yml up -d
# stand.sh already does that.
#
# Limits are for a 4 vCPU / 8 GiB VPS (e.g. DE-R9-8):
# postgres 1.5G/1.0  redis 96M/0.25  backend 2G/1.5  web 128M/0.5
# ≈ 3.7 GiB and 3.25 CPU — the rest stays free for OS, Docker and spikes.
name: studentleague-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      POSTGRES_DB: ${DATABASE_NAME:-studentleague}
      POSTGRES_USER: ${DATABASE_USERNAME:-studentleague}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in the stand .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1536m
    mem_reservation: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
    mem_limit: 96m
    mem_reservation: 16m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Only force docker-network URLs here. Secrets come from env_file.
      # Re-declaring JWT_SECRET/DATABASE_PASSWORD with ${VAR:-example} overwrites
      # a correct .env with the example and the prod validator then kills the app.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-studentleague}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOCAL_STORAGE_DIR: /app/data/uploads
      LOCAL_STORAGE_PUBLIC_BASE_URL: /media
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseG1GC}
    volumes:
      - uploads_data:/app/data/uploads
    mem_limit: 2048m
    mem_reservation: 512m
    cpus: "1.5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${SERVER_PORT:-8080}/api/v1/health\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.5"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
