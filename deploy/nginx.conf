map $uri $is_spa {
    default 0;
    "/" 1;
    "~*^/(table|calendar|live|tournaments|teams|players|privacy|terms|login|register|forgot-password|reset-password|profile|my-team|admin|referee|analyst)/?$" 1;
    "~*^/tournaments/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
    "~*^/matches/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
    "~*^/teams/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
    "~*^/players/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
    "~*^/referee/matches/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
    "~*^/analyst/matches/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" 1;
}

map $http_user_agent $link_bot {
    default 0;
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Facebot|VKShare|WhatsApp|Slackbot|LinkedInBot|Discordbot|SkypeUriPreview|Pinterestbot)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /robots.txt {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT}/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT}/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /matches {
        include /etc/nginx/nginx-headers.conf;
        return 301 /calendar;
    }

    location = /statistics {
        include /etc/nginx/nginx-headers.conf;
        return 301 /table?tab=scorers;
    }

    location ^~ /api/ {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /ws {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location ^~ /websocket {
        include /etc/nginx/nginx-headers.conf;
        proxy_pass http://backend:${SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location ^~ /assets/ {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 404 =404 @plain_404;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        include /etc/nginx/nginx-headers.conf;
        error_page 404 =404 @plain_404;
        try_files $uri =404;
    }

    location ^~ /brand/ {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        error_page 404 =404 @plain_404;
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|json|webmanifest|xml|txt|wasm)$ {
        include /etc/nginx/nginx-headers.conf;
        error_page 404 =404 @plain_404;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/nginx-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/nginx-headers.conf;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        error_page 418 = @preview;
        error_page 404 =404 @spa_404;
        if ($link_bot = 1) {
            return 418;
        }
        if ($is_spa = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    location @preview {
        internal;
        include /etc/nginx/nginx-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Preview-Path $uri;
        rewrite ^ /api/v1/link-preview break;
        proxy_pass http://backend:${SERVER_PORT};
    }

    location @spa_404 {
        internal;
        include /etc/nginx/nginx-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    location @plain_404 {
        internal;
        include /etc/nginx/nginx-headers.conf;
        default_type text/plain;
        return 200 "Not found\n";
    }
}
