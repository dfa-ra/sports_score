name: Dev stand

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag to deploy (dev or v0.2.0). Empty = rebuild rolling dev from this commit."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-dev-stand
  cancel-in-progress: false

jobs:
  publish-dev:
    name: Publish rolling dev release
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      tag: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if ./mvnw -B -DskipTests package; then
              exit 0
            fi
            echo "Maven package failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Stage backend JAR
        run: |
          mkdir -p out
          JAR="$(find backend/target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "${JAR}"
          cp "${JAR}" out/student-league-backend-dev.jar

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          VITE_APP_REVISION: ${{ github.sha }}
          VITE_APP_CHANNEL: dev
        run: |
          npm ci
          npm run build
          tar -czf "../out/student-league-web-dev.tar.gz" -C dist .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Closed-test Android APK (dev stand)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=http://144.31.153.52:3000/api/v1
          cp build/app/outputs/flutter-apk/app-release.apk ../out/student-league-dev-android.apk

      - name: Publish prerelease tag dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Rolling dev stand (web + closed Android APK) from ${GITHUB_SHA}"
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev out/student-league-backend-dev.jar out/student-league-web-dev.tar.gz out/student-league-dev-android.apk --clobber
            gh release edit dev --prerelease --latest=false --title "Dev stand (rolling, closed)" --notes "${NOTES}"
          else
            gh release create dev \
              --prerelease \
              --latest=false \
              --title "Dev stand (rolling, closed)" \
              --notes "${NOTES}" \
              out/student-league-backend-dev.jar \
              out/student-league-web-dev.tar.gz \
              out/student-league-dev-android.apk
          fi
          git tag -f dev
          git push -f origin refs/tags/dev

  deploy:
    name: SSH deploy to dev
    needs: [publish-dev]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
        needs.publish-dev.result == 'success'
      )
    uses: ./.github/workflows/deploy-remote.yml
    with:
      release_tag: ${{ inputs.tag || 'dev' }}
      environment_name: development
      deploy_path: ${{ vars.DEV_DEPLOY_PATH || '/opt/studentleague' }}
      compose_project: studentleague-dev
      ssh_port: ${{ vars.DEV_SSH_PORT || '22' }}
    secrets:
      SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      SSH_USER: ${{ secrets.DEV_SSH_USER }}
      SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      SSH_KEY_BASE64: ${{ secrets.DEV_SSH_KEY_BASE64 }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
      STAND_ENV: ${{ secrets.DEV_STAND_ENV }}
