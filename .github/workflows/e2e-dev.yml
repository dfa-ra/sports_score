name: E2E dev

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: e2e-dev-stand
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against dev stand
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: http://144.31.153.52:3000
      E2E_FAN_EMAIL: ${{ secrets.E2E_FAN_EMAIL }}
      E2E_FAN_PASSWORD: ${{ secrets.E2E_FAN_PASSWORD }}
      E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
      E2E_PLAYER_PASSWORD: ${{ secrets.E2E_PLAYER_PASSWORD }}
      E2E_CAPTAIN_EMAIL: ${{ secrets.E2E_CAPTAIN_EMAIL }}
      E2E_CAPTAIN_PASSWORD: ${{ secrets.E2E_CAPTAIN_PASSWORD }}
      E2E_REFEREE_EMAIL: ${{ secrets.E2E_REFEREE_EMAIL }}
      E2E_REFEREE_PASSWORD: ${{ secrets.E2E_REFEREE_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Refuse production URL
        run: |
          python3 - <<'PY'
          import os, sys
          url = os.environ.get("E2E_BASE_URL", "")
          if "itmoliga.ru" in url.lower():
              print("E2E refuses to run against production", url, file=sys.stderr)
              sys.exit(1)
          print("baseURL", url)
          PY

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-dev-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
