# Reusable SSH deploy onto a stand (dev or prod).
# Caller must pass the GitHub Release tag and the matching SSH secrets.
name: Deploy remote

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      deploy_path:
        required: false
        type: string
        default: /opt/studentleague
      compose_project:
        required: false
        type: string
        default: studentleague
      ssh_port:
        required: false
        type: string
        default: "22"
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      SSH_KEY_BASE64:
        required: false
      SSH_KNOWN_HOSTS:
        required: false
      STAND_ENV:
        required: false

jobs:
  deploy:
    name: SSH deploy (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        id: stand
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_BASE64: ${{ secrets.SSH_KEY_BASE64 }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || { [ -z "${SSH_KEY}" ] && [ -z "${SSH_KEY_BASE64}" ]; }; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets for ${{ inputs.environment_name }} are empty — skip deploy."
            echo "See docs/ci.md for DEV_* / PROD_* names."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        if: steps.stand.outputs.configured == 'true'
        env:
          DEV_SSH_KEY: ${{ secrets.SSH_KEY }}
          DEV_SSH_KEY_BASE64: ${{ secrets.SSH_KEY_BASE64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY="$HOME/.ssh/stand_deploy"
          python3 deploy/normalize_ssh_key.py "$KEY"
          if ! ssh-keygen -y -P "" -f "$KEY" >/tmp/stand.pub 2>/tmp/stand.keyerr; then
            echo "Normalized SSH key is still not a usable private key."
            echo "ssh-keygen: $(tr '\n' ' ' < /tmp/stand.keyerr)"
            echo "Typical causes: pasted the .pub file, key has a passphrase, or the PEM body is truncated."
            echo "Fix:  base64 -w0 deploy-key   → secret *_SSH_KEY_BASE64"
            exit 1
          fi
          echo "Private key accepted."
          ssh-keygen -lf "$KEY"

      - name: Trust stand host
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ inputs.ssh_port }}
        run: |
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" | sed 's/\r$//' > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS is empty — falling back to ssh-keyscan (TOFU)."
            ssh-keyscan -p "${SSH_PORT}" -T 10 "${SSH_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy/ and seed .env if missing
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          STAND_ENV: ${{ secrets.STAND_ENV }}
        run: |
          KEY="$HOME/.ssh/stand_deploy"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          SSH=(ssh -i "$KEY" -p "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes)
          "${SSH[@]}" "${REMOTE}" "mkdir -p '${DEPLOY_PATH}/deploy' '${DEPLOY_PATH}/release'"
          rsync -az --delete -e "ssh -i ${KEY} -p ${SSH_PORT} -o IdentitiesOnly=yes -o BatchMode=yes" \
            deploy/ "${REMOTE}:${DEPLOY_PATH}/deploy/"
          if [ -n "${STAND_ENV}" ]; then
            umask 077
            printf '%s\n' "${STAND_ENV}" > /tmp/stand.env
            scp -i "$KEY" -P "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes \
              /tmp/stand.env "${REMOTE}:/tmp/studentleague.stand.env"
            rm -f /tmp/stand.env
            "${SSH[@]}" "${REMOTE}" "if [ ! -f '${DEPLOY_PATH}/.env' ]; then mv /tmp/studentleague.stand.env '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'; else rm -f /tmp/studentleague.stand.env; fi"
          fi

      - name: Download release on the stand and compose up
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPOSE_PROJECT: ${{ inputs.compose_project }}
        run: |
          KEY="$HOME/.ssh/stand_deploy"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          umask 077
          printf '%s' "${{ github.token }}" > /tmp/deploy.token
          scp -i "$KEY" -P "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes \
            /tmp/deploy.token "${REMOTE}:${DEPLOY_PATH}/.deploy-token"
          rm -f /tmp/deploy.token
          ssh -i "$KEY" -p "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes "${REMOTE}" \
            "chmod +x '${DEPLOY_PATH}/deploy/stand.sh' && \
             RELEASE_TAG='${RELEASE_TAG}' \
             GITHUB_REPOSITORY='${{ github.repository }}' \
             DEPLOY_ROOT='${DEPLOY_PATH}' \
             COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT}' \
             '${DEPLOY_PATH}/deploy/stand.sh'"
