# Reusable SSH deploy onto a stand (dev or prod).
# Caller must pass the GitHub Release tag and the matching SSH secrets.
name: Deploy remote

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      deploy_path:
        required: false
        type: string
        default: /opt/studentleague
      compose_project:
        required: false
        type: string
        default: studentleague
      ssh_port:
        required: false
        type: string
        default: "22"
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_KEY:
        required: false
      SSH_KEY_BASE64:
        required: false
      SSH_KNOWN_HOSTS:
        required: false
      STAND_ENV:
        required: false

jobs:
  deploy:
    name: SSH deploy (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        id: stand
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_BASE64: ${{ secrets.SSH_KEY_BASE64 }}
        run: |
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ] || { [ -z "${SSH_KEY}" ] && [ -z "${SSH_KEY_BASE64}" ]; }; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets for ${{ inputs.environment_name }} are empty — skip deploy."
            echo "See docs/ci.md for DEV_* / PROD_* names."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        if: steps.stand.outputs.configured == 'true'
        env:
          DEV_SSH_KEY: ${{ secrets.SSH_KEY }}
          DEV_SSH_KEY_BASE64: ${{ secrets.SSH_KEY_BASE64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY="$HOME/.ssh/stand_deploy"
          python3 deploy/normalize_ssh_key.py "$KEY"
          if ! ssh-keygen -y -P "" -f "$KEY" >/tmp/stand.pub 2>/tmp/stand.keyerr; then
            echo "Normalized SSH key is still not a usable private key."
            echo "ssh-keygen: $(tr '\n' ' ' < /tmp/stand.keyerr)"
            echo "Typical causes: pasted the .pub file, key has a passphrase, or the PEM body is truncated."
            echo "Fix:  base64 -w0 deploy-key   → secret *_SSH_KEY_BASE64"
            exit 1
          fi
          echo "Private key accepted."
          ssh-keygen -lf "$KEY"

      - name: Trust stand host
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ inputs.ssh_port }}
        run: |
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" | sed 's/\r$//' > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS is empty — falling back to ssh-keyscan (TOFU)."
            ssh-keyscan -p "${SSH_PORT}" -T 10 "${SSH_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy/ and seed .env if missing
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          STAND_ENV: ${{ secrets.STAND_ENV }}
        run: |
          KEY="$HOME/.ssh/stand_deploy"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          SSH=(ssh -i "$KEY" -p "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40)
          SCP=(scp -i "$KEY" -P "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40)
          "${SSH[@]}" "${REMOTE}" "mkdir -p '${DEPLOY_PATH}/deploy' '${DEPLOY_PATH}/release' && find '${DEPLOY_PATH}/deploy' -mindepth 1 -delete"
          # Fresh VPS often has no rsync. tar + ssh is enough.
          tar -C deploy -czf - . | "${SSH[@]}" "${REMOTE}" "tar -xzf - -C '${DEPLOY_PATH}/deploy'"
          if [ -n "${STAND_ENV}" ]; then
            umask 077
            printf '%s\n' "${STAND_ENV}" > /tmp/stand.env
            "${SCP[@]}" /tmp/stand.env "${REMOTE}:/tmp/studentleague.stand.env"
            rm -f /tmp/stand.env
            "${SSH[@]}" "${REMOTE}" "if [ ! -f '${DEPLOY_PATH}/.env' ]; then mv /tmp/studentleague.stand.env '${DEPLOY_PATH}/.env' && chmod 600 '${DEPLOY_PATH}/.env'; else rm -f /tmp/studentleague.stand.env; fi"
          fi
          "${SSH[@]}" "${REMOTE}" "set -e
            miss=0
            for c in docker curl python3 tar; do
              if ! command -v \"\$c\" >/dev/null 2>&1; then
                echo \"Missing command on the stand: \$c\"
                miss=1
              fi
            done
            if ! docker compose version >/dev/null 2>&1; then
              echo 'Missing: docker compose plugin v2'
              miss=1
            fi
            if [ ! -f '${DEPLOY_PATH}/.env' ]; then
              echo \"Missing ${DEPLOY_PATH}/.env — copy deploy/.env.prod.example (prod) or deploy/.env.example (dev), fill secrets, or set DEV_STAND_ENV / PROD_STAND_ENV before the first deploy.\"
              miss=1
            fi
            if [ \"\$miss\" -ne 0 ]; then
              echo 'See docs/ci.md — one-time stand setup.'
              exit 1
            fi
          "

      - name: Download release on the stand and compose up
        if: steps.stand.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ inputs.ssh_port }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPOSE_PROJECT: ${{ inputs.compose_project }}
        run: |
          KEY="$HOME/.ssh/stand_deploy"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          SSH=(ssh -i "$KEY" -p "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40)
          SCP=(scp -i "$KEY" -P "${SSH_PORT}" -o IdentitiesOnly=yes -o BatchMode=yes -o TCPKeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40)
          umask 077
          printf '%s' "${{ github.token }}" > /tmp/deploy.token
          "${SCP[@]}" /tmp/deploy.token "${REMOTE}:${DEPLOY_PATH}/.deploy-token"
          rm -f /tmp/deploy.token
          # Prod compose/health can sit quiet long enough for the VPS to drop the session.
          for attempt in 1 2 3; do
            if "${SSH[@]}" "${REMOTE}" \
              "chmod +x '${DEPLOY_PATH}/deploy/stand.sh' && \
               RELEASE_TAG='${RELEASE_TAG}' \
               GITHUB_REPOSITORY='${{ github.repository }}' \
               DEPLOY_ROOT='${DEPLOY_PATH}' \
               COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT}' \
               '${DEPLOY_PATH}/deploy/stand.sh'"; then
              exit 0
            fi
            echo "stand.sh via SSH failed (attempt ${attempt}), retrying..."
            sleep $((attempt * 10))
          done
          exit 1
