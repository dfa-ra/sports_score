name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  backend-jar:
    name: Backend JAR
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  web-release:
    name: Web release bundle
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack dist
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          tar -czf "../student-league-web-${VERSION}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: student-league-web-*.tar.gz

  android-release:
    name: Android release APK/AAB
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set Flutter version from tag
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # pubspec: version: x.y.z+build → keep build number 1 for tag releases
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml
      - name: Build release APK (unsigned / debug-keystore default)
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Rename artifacts
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p ../release-android
          cp build/app/outputs/flutter-apk/app-release.apk "../release-android/student-league-${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../release-android/student-league-${VERSION}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/*

  ios-release:
    name: iOS IPA (unsigned stub)
    needs: resolve-version
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set Flutter version from tag
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          sed -i.bak "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Archive app payload
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p ../release-ios
          # Without signing we ship the Runner.app payload for later re-signing
          cd build/ios/iphoneos
          zip -r "../../../../release-ios/student-league-${VERSION}-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: release-ios/*
          if-no-files-found: warn

  github-release:
    name: Publish GitHub Release
    needs: [resolve-version, backend-jar, web-release, android-release, ios-release]
    if: |
      always() &&
      needs.backend-jar.result == 'success' &&
      needs.web-release.result == 'success' &&
      needs.android-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.jar' -o -name '*.tar.gz' -o -name '*.apk' -o -name '*.aab' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Student League v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
