name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  backend-jar:
    name: Backend JAR
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - name: Rename JAR
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p ../release-backend
          JAR="$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "${JAR}"
          cp "${JAR}" "../release-backend/student-league-backend-${VERSION}.jar"
      - name: Upload backend JAR to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-backend/student-league-backend-*.jar)
          test ${#files[@]} -gt 0
          gh release upload "v${{ needs.resolve-version.outputs.version }}" "${files[@]}" --clobber

  web-release:
    name: Web release bundle
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build web
        env:
          VITE_APP_VERSION: ${{ needs.resolve-version.outputs.version }}
          VITE_APP_REVISION: ${{ github.sha }}
          VITE_APP_CHANNEL: prod
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: |
          VITE_GOOGLE_CLIENT_ID="$(bash ../scripts/google_client_id.sh)"
          export VITE_GOOGLE_CLIENT_ID
          echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
          npm run build
      - name: Pack dist
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          tar -czf "../student-league-web-${VERSION}.tar.gz" -C dist .
      - name: Upload web bundle to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(student-league-web-*.tar.gz)
          test ${#files[@]} -gt 0
          gh release upload "v${{ needs.resolve-version.outputs.version }}" "${files[@]}" --clobber

  android-release:
    name: Android release APK/AAB
    needs: [resolve-version, github-release]
    runs-on: ubuntu-latest
    # Same as iOS: a Maven Central 403 must not block the GitHub Release or prod SSH deploy.
    # stand.sh only needs the backend JAR and web tarball.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 3.50 stable makes flutter analyze fail on the existing material.dart imports.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Set Flutter version from tag
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # pubspec: version: x.y.z+build → keep build number 1 for tag releases
          sed -i "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml
      - name: Build release APK (unsigned / debug-keystore default)
        run: |
          for i in 1 2 3; do
            if flutter build apk --release --dart-define=API_BASE_URL=https://itmoliga.ru/api/v1; then
              exit 0
            fi
            echo "APK build failed (attempt ${i}/3)"
            sleep $((i * 20))
          done
          exit 1
      - name: Build release App Bundle
        run: |
          for i in 1 2 3; do
            if flutter build appbundle --release --dart-define=API_BASE_URL=https://itmoliga.ru/api/v1; then
              exit 0
            fi
            echo "AAB build failed (attempt ${i}/3)"
            sleep $((i * 20))
          done
          exit 1
      - name: Rename artifacts
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p ../release-android
          cp build/app/outputs/flutter-apk/app-release.apk "../release-android/student-league-${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../release-android/student-league-${VERSION}-android.aab"
      - name: Upload Android builds to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-android/*)
          test ${#files[@]} -gt 0
          gh release upload "v${{ needs.resolve-version.outputs.version }}" "${files[@]}" --clobber

  ios-release:
    name: iOS IPA (unsigned stub)
    needs: [resolve-version, github-release]
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # 3.50 stable makes flutter analyze fail on the existing material.dart imports.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Set Flutter version from tag
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          sed -i.bak "s/^version: .*/version: ${VERSION}+1/" pubspec.yaml
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://itmoliga.ru/api/v1
      - name: Archive app payload
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          mkdir -p ../release-ios
          # Without signing we ship the Runner.app payload for later re-signing
          cd build/ios/iphoneos
          zip -r "../../../../release-ios/student-league-${VERSION}-ios-unsigned.zip" Runner.app
      - name: Upload iOS payload to the release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release-ios/*)
          test ${#files[@]} -gt 0
          gh release upload "v${{ needs.resolve-version.outputs.version }}" "${files[@]}" --clobber

  github-release:
    name: Publish GitHub Release
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Write short notes
        run: |
          chmod +x scripts/release_notes.sh
          scripts/release_notes.sh "v${{ needs.resolve-version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.resolve-version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "KronScore ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --title "KronScore ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  deploy-prod:
    name: SSH deploy to prod
    needs: [resolve-version, github-release, backend-jar, web-release]
    if: |
      needs.github-release.result == 'success' &&
      needs.backend-jar.result == 'success' &&
      needs.web-release.result == 'success'
    uses: ./.github/workflows/deploy-remote.yml
    with:
      release_tag: v${{ needs.resolve-version.outputs.version }}
      environment_name: production
      deploy_path: ${{ vars.PROD_DEPLOY_PATH || '/opt/studentleague' }}
      compose_project: studentleague-prod
      ssh_port: ${{ vars.PROD_SSH_PORT || '22' }}
      app_public_url: https://itmoliga.ru
    secrets:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSH_KEY_BASE64: ${{ secrets.PROD_SSH_KEY_BASE64 }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      STAND_ENV: ${{ secrets.PROD_STAND_ENV }}
