spring:
  application:
    name: student-league
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studentleague}
    username: ${DATABASE_USERNAME:studentleague}
    password: ${DATABASE_PASSWORD:studentleague}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
    web:
      pageable:
        max-page-size: 500
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-long!!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT:10}
    # docs/api.md: forgot-password has a limit but no numbers. 5 per 15 minutes per IP+email.
    forgot-password-requests: ${FORGOT_PASSWORD_RATE_LIMIT:5}
    forgot-password-window-minutes: ${FORGOT_PASSWORD_RATE_WINDOW_MINUTES:15}
    # photo-ticket was not mentioned with numbers. 10 per 15 minutes per IP and per signed-in user.
    photo-ticket-requests: ${PHOTO_TICKET_RATE_LIMIT:10}
    photo-ticket-window-minutes: ${PHOTO_TICKET_RATE_WINDOW_MINUTES:15}
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  local-storage:
    root-dir: ${LOCAL_STORAGE_DIR:./data/uploads}
    public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:/media}
  # One-shot rewrite of logos and player photos already under /media that still carry EXIF orientation.
  # Dev only until Захар says да + backup. Default off. Not a Flyway migration. Do not point this at production /media.
  media:
    orient-backfill: ${APP_MEDIA_ORIENT_BACKFILL:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    # Ignored on production (compose project *prod* or public host itmoliga.ru).
    e2e-email: ${E2E_ADMIN_EMAIL:}
  auth:
    auto-approve-roles: ${AUTH_AUTO_APPROVE_ROLES:false}
  demo-data:
    enabled: ${APP_DEMO_DATA:false}
  # Public site origin for password-reset links. No trailing slash required.
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  google:
    # Comma-separated. Empty keeps email/password login and hides nothing on the API
    # except POST /auth/google, which responds that Google sign-in is not configured.
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    starttls: ${MAIL_STARTTLS:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    org.springframework.security: INFO
