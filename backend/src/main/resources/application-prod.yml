spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.studentleague: INFO
    org.springframework.security: WARN

app:
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  local-storage:
    root-dir: ${LOCAL_STORAGE_DIR:/app/data/uploads}
    public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:/media}
  jwt:
    # Must be overridden via JWT_SECRET env in production (min 32 chars).
    secret: ${JWT_SECRET}
