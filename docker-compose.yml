services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentleague
      POSTGRES_USER: studentleague
      POSTGRES_PASSWORD: studentleague
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentleague -d studentleague"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["full"]
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/studentleague
      DATABASE_USERNAME: studentleague
      DATABASE_PASSWORD: studentleague
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
